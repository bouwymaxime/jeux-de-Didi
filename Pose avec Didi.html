const columns=[{label:'unités',letter:'u'},{label:'dizaines',letter:'d'},{label:'centaines',letter:'c'},{label:'unités de mille',letter:'m'}];
let state={screen:'home',mode:null,level:null,phase:'setup',a:null,b:null,draftA:'',draftB:'',score:loadScore(),solved:0,hadError:false,rows:[Array(4).fill(null),Array(4).fill(null)],result:Array(4).fill(null),carries:Array(4).fill(null),selected:null,nextPlace:0,pendingCarry:null,error:null,message:null,showWin:false,lastPoints:0};
function loadScore(){try{return Math.max(0,Number(localStorage.getItem('poseAvecDidi_score')||0))||0}catch(e){return 0}}
function saveScore(){try{localStorage.setItem('poseAvecDidi_score',String(state.score))}catch(e){}}
function digitsOf(n){return Array.from({length:4},(_,p)=>p<4&&Math.floor(n/10**p)>0||p===0?Math.floor(n/10**p)%10:null)}
function digitsForDisplay(n){let x=Array(4).fill(null);for(let p=0;p<4;p++){if(p===0||Math.floor(n/10**p)>0)x[p]=Math.floor(n/10**p)%10;}return x}
function digitOf(n,p){return Math.floor(n/10**p)%10}
function expectedResult(){return state.a+state.b}
function digitsNeeded(){return String(expectedResult()).length}
function expectedCarry(place){if(place<=0||place>3)return null;let carry=0;for(let p=0;p<place;p++){carry=Math.floor((digitOf(state.a,p)+digitOf(state.b,p)+carry)/10);}return carry||null}
function levelLabel(level){return level==='CP'?'Niveau CP':level==='CE1'?'Niveau CE1':level==='CE2'?'Niveau CE2':''}
function levelDigits(level){return level==='CP'?2:level==='CE1'?3:4}
function chooseNumbers(level=state.level){let operandMax,resultMax;if(level==='CP'){operandMax=99;resultMax=100}else if(level==='CE1'){operandMax=999;resultMax=1000}else{operandMax=9999;resultMax=9999}let a=0,b=0;do{a=Math.floor(Math.random()*(operandMax+1));b=Math.floor(Math.random()*(operandMax+1))}while(a+b>=resultMax||(a===0&&b===0));return [a,b]}
function start(mode,keepLevel=null){const oldScore=state.score;const oldSolved=state.solved;state={screen:'game',mode,level:mode==='B'?(keepLevel||null):null,phase:mode==='A'?'setup':(keepLevel?'placing':'levelselect'),a:null,b:null,draftA:'',draftB:'',score:oldScore,solved:oldSolved,hadError:false,rows:[Array(4).fill(null),Array(4).fill(null)],result:Array(4).fill(null),carries:Array(4).fill(null),selected:null,nextPlace:0,pendingCarry:null,error:null,message:null,showWin:false,lastPoints:0};if(mode==='B'&&keepLevel){[state.a,state.b]=chooseNumbers(keepLevel);state.message='Observe les deux nombres, puis place chaque chiffre dans la bonne colonne.'}render()}
function selectLevel(level){state.level=level;state.phase='placing';state.rows=[Array(4).fill(null),Array(4).fill(null)];state.result=Array(4).fill(null);state.carries=Array(4).fill(null);state.selected=null;state.error=null;state.hadError=false;[state.a,state.b]=chooseNumbers(level);state.message='Observe les deux nombres, puis place chaque chiffre dans la bonne colonne.';render()}
function resetScore(){if(!confirm('Remettre le score à zéro ?'))return;state.score=0;state.solved=0;saveScore();render()}
function goHome(){state.screen='home';state.showWin=false;render()}
function restart(){if(state.mode==='B'&&state.level)start('B',state.level);else start(state.mode)}
function setupSubmit(){const aEl=document.getElementById('first-number'),bEl=document.getElementById('second-number');if(!aEl||!bEl)return;let aStr=(state.draftA||aEl.value||'').trim(),bStr=(state.draftB||bEl.value||'').trim();if(!/^\d{1,3}$/.test(aStr)||!/^\d{1,3}$/.test(bStr)){state.error={kind:'form'};state.message='Écris deux nombres entiers entre 0 et 999.';render();return}const a=Number(aStr),b=Number(bStr);state.a=a;state.b=b;state.rows=[digitsForDisplay(a),digitsForDisplay(b)];beginCalc()}
function updateSetupInput(row,val){if(state.screen!=='game'||state.phase!=='setup')return;let clean=String(val??'').replace(/\D+/g,'').slice(0,3);if(row===0)state.draftA=clean;else state.draftB=clean;state.rows[row]=clean===''?Array(4).fill(null):digitsForDisplay(Number(clean));const input=document.getElementById(row===0?'first-number':'second-number');if(input&&input.value!==clean)input.value=clean;refreshSetupBoard()}
function refreshSetupBoard(){for(let row=0;row<2;row++){for(let place=0;place<4;place++){const btn=document.querySelector(`[data-kind="operand"][data-row="${row}"][data-place="${place}"]`);if(!btn)continue;const digit=btn.querySelector('.digit');const val=state.rows[row][place];if(digit)digit.textContent=val===null?'':String(val);btn.classList.toggle('empty',val===null);btn.setAttribute('aria-label',`${row===0?'Premier nombre':'Second nombre'} : ${columns[place].label}${val===null?'':', '+val}`)}}}
function beginCalc(){state.phase='calculate';state.result=Array(4).fill(null);state.carries=Array(4).fill(null);state.nextPlace=0;state.pendingCarry=null;state.selected=null;state.error=null;state.message='Choisis une case du résultat ou une retenue, puis écris ton chiffre.';render()}
function verifyPlacement(){if(state.phase!=='placing')return;const nums=[state.a,state.b];for(let row=0;row<2;row++){const expected=digitsForDisplay(nums[row]);for(let p=0;p<4;p++){if(state.rows[row][p]!==expected[p]){state.hadError=true;state.error={kind:'operand',row,place:p};state.message=`Erreur dans la pose du ${row===0?'premier':'second'} nombre. Vérifie les colonnes.`;state.selected={kind:'operand',row,place:p};render();return}}}state.phase='placed';state.selected=null;state.error=null;state.message='Bravo ! Ton addition est bien posée. Tu peux maintenant calculer.';render()}
function selectCell(kind,row,place){if(state.showWin)return;if(kind==='operand'){if(state.phase!=='placing'||place>=levelDigits(state.level||'CE1'))return;state.selected={kind,row,place};state.error=null;state.message='Inscris le chiffre dans la colonne que tu as choisie.';render();return}if(state.phase!=='calculate')return;if(kind==='result'){if(place>=digitsNeeded())return;state.selected={kind,place};state.error=null;state.message=`Case du résultat sélectionnée : ${columns[place].label}.`;render();return}if(kind==='carry'){if(place===0||place>=digitsNeeded())return;state.selected={kind,place};state.error=null;state.message=`Case de retenue sélectionnée : vers les ${columns[place].label}.`;render()}}
function inputDigit(n){if(state.showWin||state.screen!=='game'||!state.selected)return;let {kind,row,place}=state.selected;if(kind==='operand'&&state.phase==='placing'){state.rows[row][place]=n;state.error=null;state.message='Continue de placer les chiffres, puis valide la pose.';render();return}if(state.phase!=='calculate')return;if(kind==='carry'){state.carries[place]=n;state.error=null;state.message='Retenue inscrite. Tu peux choisir une autre case ou vérifier.';if(allResultsFilled())validate(true);else render();return}if(kind==='result'){state.result[place]=n;state.error=null;state.message='Chiffre du résultat inscrit. Tu peux compléter une autre case ou vérifier.';if(allResultsFilled())validate(true);else render();return}}
function allResultsFilled(){return state.phase==='calculate'&&Array.from({length:digitsNeeded()},(_,p)=>state.result[p]!==null).every(Boolean)}
function clearCell(){if(state.screen!=='game'||state.showWin||!state.selected)return;let {kind,row,place}=state.selected;if(kind==='operand'&&state.phase==='placing')state.rows[row][place]=null;else if(kind==='result'&&state.phase==='calculate')state.result[place]=null;else if(kind==='carry'&&state.phase==='calculate')state.carries[place]=null;state.error=null;state.message='Case effacée. Inscris le bon chiffre.';if(allResultsFilled())validate(true);else render()}
function validate(auto=false){if(state.phase!=='calculate'||state.showWin)return;if(!allResultsFilled()){if(!auto){state.message='Complète tous les chiffres du résultat avant de vérifier.';render()}return}
 const expected=expectedResult();for(let p=0;p<digitsNeeded();p++){
 if(state.result[p]!==digitOf(expected,p)){state.hadError=true;state.error={kind:'result',place:p};state.message=`Erreur au chiffre des ${columns[p].label}. Regarde ce calcul et corrige le carré.`;state.selected={kind:'result',place:p};render();return}
 if(p+1<digitsNeeded()){
  const actual=state.carries[p+1],need=expectedCarry(p+1);
  if(need!==actual){state.hadError=true;state.error={kind:'carry',place:p+1};state.message=need===1&&actual===null?`Tu as oublié la retenue dans les ${columns[p+1].label}.`:`Erreur dans la retenue des ${columns[p+1].label}.`;state.selected={kind:'carry',place:p+1};render();return}
 }
 }
 state.showWin=true;state.phase='win';state.lastPoints=state.hadError?1:2;state.score+=state.lastPoints;state.solved++;saveScore();render();
}
function newRound(){start(state.mode)}
function toggleFullscreen(){const el=document.documentElement;if(!document.fullscreenElement){if(el.requestFullscreen)el.requestFullscreen().catch(()=>{})}else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
function cellClass(place,kind,row){let classes=[`col${place}`];const active=state.selected&&state.selected.kind===kind&&state.selected.place===place&&(kind!=='operand'||state.selected.row===row);const bad=state.error&&state.error.kind===kind&&state.error.place===place&&(kind!=='operand'||state.error.row===row);if(active)classes.push('selected');if(bad)classes.push('error');return classes.join(' ')}
function makeCell(kind,row,place,value){const operandLimit=levelDigits(state.level||'CE1');const disabled=kind==='operand'&&place>=operandLimit||kind==='operand'&&state.phase!=='placing'||kind==='result'&&(state.phase==='setup'||state.phase==='placing'||state.phase==='levelselect'||state.phase==='placed'||place>=digitsNeeded())||state.showWin;const ghost=kind==='operand'&&place>=operandLimit||kind==='result'&&(state.phase==='setup'||state.phase==='placing'||state.phase==='levelselect'||state.phase==='placed'||place>=digitsNeeded());const cl=`digit-cell ${cellClass(place,kind,row)} ${value===null?'empty':''} ${ghost?'locked readonly':disabled?'readonly':'editable'}`;const label=kind==='result'?'Résultat':row===0?'Premier nombre':'Second nombre';const txt=value===null?'':String(value);const onclick=disabled?'':`onclick="selectCell('${kind}',${row},${place})"`;return `<button type="button" data-kind="${kind}" data-row="${row}" data-place="${place}" class="${cl}" style="grid-column:${4-place};grid-row:${kind==='result'?5:row===0?2:3}" ${onclick} ${disabled?'disabled':''} aria-label="${label} : ${columns[place].label}${txt?', '+txt:''}"><span class="digit">${txt}</span></button>`}
function makeCarry(place){if(place===0)return `<div style="grid-column:4;grid-row:1"></div>`;const usable=(state.phase==='calculate'||state.phase==='win')&&place<digitsNeeded();const val=state.carries[place];const disabled=!usable||state.showWin;const cl=`carry-cell col${place} ${cellClass(place,'carry')} ${val===null?'carry-blank':''} ${disabled?'off':'selectable'}`;return `<button type="button" data-kind="carry" data-row="0" data-place="${place}" style="grid-row:1;grid-column:${4-place}" class="${cl}" ${disabled?'disabled':''} onclick="selectCell('carry',0,${place})" aria-label="Retenue des ${columns[place].label}${val===null?'':': '+val}">${val??''}</button>`}
function messageInfo(){if(state.phase==='levelselect')return {icon:'🎯',cls:'',title:'Choisis ton niveau',detail:'Sélectionne un niveau pour commencer.'};if(state.phase==='setup')return {icon:state.error?'⚠️':'🐾',cls:state.error?'error':'',title:state.error?state.message:'C’est toi qui choisis !',detail:state.error?'':'Écris deux nombres de 0 à 999. Ils s’affichent aussitôt dans le gabarit.'};if(state.phase==='placing')return {icon:state.error?'🔎':'✏️',cls:state.error?'error':'',title:state.message||'Place les chiffres dans les carrés.',detail:state.error?'':'Bleu : unités · Rouge : dizaines · Vert : centaines · Noir : unités de mille.'};if(state.phase==='placed')return {icon:'✅',cls:'',title:'Ton addition est bien posée !',detail:'Didi a vérifié la place de chaque chiffre. Clique sur « Je calcule ».'};return {icon:state.error?'🔎':'💡',cls:state.error?'error':'',title:state.message||'À toi de calculer !',detail:state.error?'':'Choisis toi-même une case du résultat ou une retenue, puis utilise le clavier.'}}
function sidePanel(){const setup=state.phase==='setup',placing=state.phase==='placing',placed=state.phase==='placed',working=state.phase==='calculate';const info=messageInfo();return `<section class="side"><div class="side-heading"><div class="step-circle">${setup||placing||placed?'1':'2'}</div><div><h2>${setup?'Choisis tes nombres':placing?'Pose ton addition':placed?'Addition bien posée !':working?'Calcule ton addition':'Bravo !'}</h2><p>${state.mode==='A'?'Je choisis mes deux nombres':(state.level?levelLabel(state.level):'Didi choisit mes nombres')}</p></div></div>
 ${setup?`<form class="setup" onsubmit="event.preventDefault();setupSubmit()"><div class="input-group"><label for="first-number">Mon premier nombre</label><input id="first-number" aria-label="Mon premier nombre" autocomplete="off" inputmode="numeric" type="number" min="0" max="999" value="${state.draftA}" oninput="updateSetupInput(0,this.value)" required></div><div class="input-group"><label for="second-number">Mon second nombre</label><input id="second-number" aria-label="Mon second nombre" autocomplete="off" inputmode="numeric" type="number" min="0" max="999" value="${state.draftB}" oninput="updateSetupInput(1,this.value)" required></div><button class="primary" type="submit">Je calcule →</button></form>`:''}
 ${!setup?`<div class="challenge"><div class="mini">${placing?'Les nombres donnés par Didi':'Mon addition'}</div><div class="numbers">${state.a}<em>+</em>${state.b}</div><p>${placing?'À toi de placer les chiffres dans le gabarit.':placed?'Les chiffres sont tous à la bonne place.':'Choisis les cases que tu veux remplir, puis vérifie ton calcul.'}</p></div>`:''}
 <div class="feedback ${info.cls}"><span class="bubble-icon">${info.icon}</span><div><b>${info.title}</b><p>${info.detail}</p></div></div>
 <div class="spacer"></div>
 ${placed?`<div class="side-actions"><button class="primary" type="button" onclick="beginCalc()">Je calcule →</button></div>`:''}
 ${!setup&&!placed?`<div><p class="pad-title">${placing?'Sélectionne une case, puis tape un chiffre':'Clavier de calcul'}</p><div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button type="button" onclick="inputDigit(${n})" aria-label="Chiffre ${n}" ${state.selected?'':'disabled'}>${n}</button>`).join('')}</div></div>
 <div class="side-actions">${placing?`<button class="primary" onclick="verifyPlacement()">Mon addition est posée ✓</button>`:`<button class="secondary" onclick="clearCell()" ${!state.selected?'disabled':''}>⌫ Effacer</button><button class="primary" onclick="validate(false)">Vérifier ✓</button>`}</div>`:''}
 ${working?'<p class="tiny-tip">Les ronds en pointillés servent aux retenues. Clique directement sur la case que tu veux remplir.</p>':''}</section>`}
function boardPanel(){const ready=state.phase==='calculate'||state.phase==='win';const boardCells=[3,2,1,0].map(p=>makeCarry(p)).join('')+[0,1].flatMap(row=>[3,2,1,0].map(p=>makeCell('operand',row,p,state.rows[row][p]))).join('')+`<div class="rule"></div>`+[3,2,1,0].map(p=>makeCell('result',0,p,state.result[p])).join('');return `<section class="board"><div class="board-heading"><div><h2>Mon addition posée</h2><small>${ready?'Unités → dizaines → centaines → milliers':state.phase==='placed'?'Le placement est vérifié':'Chaque chiffre a sa colonne'}</small></div><span class="board-state ${ready?'':'wait'}">${ready?'✦ Je calcule':state.phase==='placed'?'✓ Bien posée':'✎ Je prépare'}</span></div><div class="operation"><div class="plus-equal"><span class="plus">+</span><span class="equal">=</span></div><div class="grid-board">${boardCells}</div></div><div class="legend">${columns.map((o,p)=>`<div class="legend-item"><i class="legend-swatch col${p}"></i>${o.label.charAt(0).toUpperCase()+o.label.slice(1)}</div>`).join('')}</div><div class="board-bottom">${ready?'Choisis librement les carrés et les ronds à compléter, puis vérifie ton calcul.':state.phase==='placed'?'Les chiffres sont bien placés. Clique sur « Je calcule » pour commencer.':'Clique sur les cases de l’addition pour y placer les chiffres.'}</div></section>`}
function winOverlay(){if(!state.showWin)return '';let pieces='';for(let i=0;i<70;i++){const colors=['#ffca43','#e86e72','#36b39c','#7864d7','#548bee'];const left=Math.random()*100,delay=Math.random()*1.2,dur=2+Math.random()*1.6,drift=(Math.random()-.5)*250,spin=(Math.random()-.5)*1100;pieces+=`<i class="confetti-piece" style="left:${left}%;background:${colors[i%5]};--delay:${delay}s;--dur:${dur}s;--drift:${drift}px;--spin:${spin}deg"></i>`}return `<div class="overlay"><div class="confetti">${pieces}</div><div class="win-card"><img class="win-dog" src="${DOG}" alt="Didi te félicite"><span class="thumb" aria-hidden="true">👍</span><h2>Bravo !</h2><p>Ton addition est juste, bien joué !</p><div class="earned">+${state.lastPoints} point${state.lastPoints>1?'s':''} ⭐</div><p>Score total : <b>${state.score} points</b></p><button class="primary" onclick="newRound()">Une nouvelle addition →</button></div></div>`}
function renderLevelSelect(){return `<main class="page"><section class="level-wrap"><div class="level-card"><div class="eyebrow">Jeu avec Didi</div><h2>Choisis ton niveau</h2><p>Avant de commencer, sélectionne un niveau.</p><div class="level-buttons"><button type="button" class="level-btn" onclick="selectLevel('CP')">Niveau CP</button><button type="button" class="level-btn" onclick="selectLevel('CE1')">Niveau CE1</button><button type="button" class="level-btn" onclick="selectLevel('CE2')">Niveau CE2</button></div></div><div class="level-note">Tu peux changer de niveau en revenant à l’accueil.</div></section></main>`}
function renderHome(){return `<main class="page"><section class="home"><div class="home-intro"><div class="eyebrow">Les jeux de Didi · Cycle 2</div><h1>Pose avec <span>Didi</span> !</h1><p class="subtitle">Les additions posées, chiffre après chiffre, à ton rythme.</p></div><div class="mode-grid"><button type="button" class="mode-card" onclick="start('A')"><div class="illustration" aria-hidden="true">${svgA}</div><div class="mode-details"><div><h2>Je pose mon addition</h2><p>Je choisis mes deux nombres, puis je calcule.</p></div><span class="play-arrow" aria-hidden="true">➜</span></div></button><button type="button" class="mode-card sport" onclick="start('B')"><div class="illustration" aria-hidden="true">${svgB}</div><div class="mode-details"><div><h2>Je m’entraîne avec Didi</h2><p>Didi choisit les nombres. Je les place, puis je calcule.</p></div><span class="play-arrow" aria-hidden="true">➜</span></div></button></div><div class="home-bottom"><p>Bonne réponse du premier coup : <b>2 points</b> · Après correction : <b>1 point</b></p><button onclick="resetScore()">Remettre le score à zéro</button></div></section></main>`}
function render(){document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><img src="${DOG}" alt="Portrait de Didi"><div><strong>Pose avec <span>Didi</span></strong><small>Les additions posées · Cycle 2</small></div></div><nav class="top-actions" aria-label="Commandes"><span class="score-chip" title="Score cumulatif">⭐ <b>${state.score}</b> pts</span>${state.screen==='game'?`<button class="small-btn" onclick="goHome()">⌂ Accueil</button><button class="small-btn" onclick="restart()">↻ Nouvelle addition</button>`:''}<button class="small-btn full-btn" onclick="toggleFullscreen()" title="Plein écran" aria-label="Plein écran">⛶</button></nav></header>${state.screen==='home'?renderHome():(state.mode==='B'&&state.phase==='levelselect'?renderLevelSelect():`<main class="page"><div class="game">${sidePanel()}${boardPanel()}</div></main>`)}<footer class="site-footer">MB. - Circ. d'Auchel - Tous droits réservés.</footer>${winOverlay()}`}
document.addEventListener('keydown',e=>{if(e.target?.matches?.('input, textarea, select'))return;if(state.screen!=='game'||state.showWin)return;if(e.key>='0'&&e.key<='9'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){e.preventDefault();inputDigit(Number(e.key))}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();clearCell()}else if(e.key==='Enter'){e.preventDefault();if(state.phase==='placing')verifyPlacement();else if(state.phase==='calculate')validate(false)}});
